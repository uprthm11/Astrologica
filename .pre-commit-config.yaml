repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
  - repo: local
    hooks:
      - id: architectural-guards
        name: Architectural Regression Guards
        entry: bash ./scripts/regression-guard.sh
        language: system
        pass_filenames: false
